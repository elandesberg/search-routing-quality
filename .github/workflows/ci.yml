name: package checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.9"
          cache: pip
          cache-dependency-path: |
            requirements-lock.txt
            requirements-docx-lock.txt
      - name: Install exact tested dependencies
        run: |
          python -m pip install --requirement requirements-lock.txt
          python -m pip install --requirement requirements-docx-lock.txt
      - name: Compile Python sources
        run: python -m py_compile *.py scripts/*.py tests/*.py
      - name: Run focused tests
        run: python -m unittest discover -v
      - name: Check self-contained HTML invariants
        run: python scripts/check_html.py
      - name: Check Google Docs handoff artifact
        run: python scripts/check_handoff_docx.py --expect-generic
      - name: Check query-level Bayes handoff source
        run: python work-packages/query-level-bayes/scripts/check_package.py
      - name: Verify query-level Bayes handoff ZIP
        run: python scripts/build_query_level_bayes_work_package.py --check

      # The full allowlist_model_pymc.py --demo run is intentionally not part
      # of routine CI. Record a passing diagnostic-gated synthetic run and
      # review its descriptive truth-recovery metrics before production use.
